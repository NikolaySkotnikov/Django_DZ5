<nav aria-label="Пагинатор">
    <ul class="pagination justify-content-center pagination-md">
        <li class="page-item {% if page_obj.has_previous %}{% else %} disabled {% endif %}">
            <a class="page-link" href="{% if page_obj.has_previous %} ?page={{ page_obj.previous_page_number}}
                                       {% else %} # {% endif %}">Предыдущая</a>
        </li>
        {% for page in page_obj.paginator.page_range %}
        <li class="page-item"><a class="page-link 
            {% if page_obj.number == page %}
            active
            {% endif %}" href="?page={{ page }}">{{ page }}</a></li>
        {% endfor %}
        <li class="page-item {% if page_obj.has_next %}{% else %} disabled {% endif %}">
            <a class="page-link" href="{% if page_obj.has_next %} ?page={{ page_obj.next_page_number}}
                                       {% else %} # {% endif %}">Следующая</a>
        </li>
    </ul>
  </nav>
